<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 text-white flex flex-col">
    <div class="p-4 text-2xl font-bold border-b border-gray-700">
      Pizza Admin
    </div>
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <a routerLink="/admin/dashboard" routerLinkActive="bg-gray-700" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 hover:text-white">
        Dashboard
      </a>
      <a routerLink="/admin/users" routerLinkActive="bg-gray-700" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 hover:text-white">
        Quản lý Users
      </a>
      <a routerLink="/admin/categories" routerLinkActive="bg-gray-700" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 hover:text-white">
        Quản lý Category
      </a>
      <a routerLink="/admin/products" routerLinkActive="bg-gray-700" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 hover:text-white">
        Quản lý Product
      </a>
      <a routerLink="/admin/toppings" routerLinkActive="bg-gray-700" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 hover:text-white">
        Quản lý Topping
      </a>
      <a routerLink="/admin/combos" routerLinkActive="bg-gray-700" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 hover:text-white">
        Quản lý Combo
      </a>
      <a routerLink="/admin/orders" routerLinkActive="bg-gray-700" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 hover:text-white">
        Quản lý Order
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Topbar -->
    <header class="h-16 bg-white border-b flex items-center justify-between px-6 shadow-sm">
      <div class="font-semibold text-xl text-gray-800">Trang Quản Trị</div>
      <div>
        <button (click)="logout()" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition">Đăng xuất</button>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
