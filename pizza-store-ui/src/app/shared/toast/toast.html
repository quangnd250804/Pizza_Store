<div *ngIf="toast.show"
     class="fixed bottom-5 right-5 z-50 flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-xl shadow-2xl border border-gray-100 transition-all duration-300 transform translate-y-0 opacity-100">

  <div *ngIf="toast.type === 'success'" class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-500 bg-green-100 rounded-lg">
    <span>✓</span>
  </div>

  <div *ngIf="toast.type === 'error'" class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-red-500 bg-red-100 rounded-lg">
    <span>✕</span>
  </div>

  <div class="ml-3 text-sm font-semibold text-gray-800">{{ toast.message }}</div>
</div>
