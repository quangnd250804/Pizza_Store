<div class="bg-white p-6 rounded shadow">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">Quản lý Topping</h2>
    <button (click)="openCreateForm()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
      + Thêm topping
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-100 border-b">
          <th class="p-3 font-semibold w-16">ID</th>
          <th class="p-3 font-semibold">Tên topping</th>
          <th class="p-3 font-semibold">Giá (VNĐ)</th>
          <th class="p-3 font-semibold">Trạng thái</th>
          <th class="p-3 font-semibold text-center">Hành động</th>
        </tr>
      </thead>
      <tbody>
        @for (t of toppings; track t.id) {
        <tr class="border-b hover:bg-gray-50 cursor-pointer" (click)="openEditForm(t)">
          <td class="p-3">{{ t.id }}</td>
          <td class="p-3">{{ t.name }}</td>
          <td class="p-3">{{ t.price | number }}đ</td>
          <td class="p-3">
            <span [class]="t.isAvailable ? 'text-green-600 font-medium' : 'text-red-600 font-medium'">
              {{ t.isAvailable ? 'Còn hàng' : 'Hết hàng' }}
            </span>
          </td>
          <td class="p-3 text-center space-x-2" (click)="$event.stopPropagation()">
            <button (click)="openEditForm(t)" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm transition">Sửa</button>
            <button (click)="deleteTopping(t.id)" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">Xóa</button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (showForm) {
<app-topping-form [topping]="selectedTopping" (close)="closeForm($event)"></app-topping-form>
}
