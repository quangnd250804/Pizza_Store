<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
    <h2 class="text-xl font-bold mb-4">{{ topping ? 'Sửa Topping' : 'Thêm Topping' }}</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Tên topping <span class="text-red-500">*</span></label>
          <input type="text" formControlName="name" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <div class="text-red-500 text-xs mt-1">Tên topping là bắt buộc.</div>
          }
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Giá (VNĐ) <span class="text-red-500">*</span></label>
          <input type="number" formControlName="price" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          @if (form.get('price')?.invalid && form.get('price')?.touched) {
          <div class="text-red-500 text-xs mt-1">Giá không hợp lệ.</div>
          }
        </div>

        <div class="flex items-center space-x-2">
          <input type="checkbox" formControlName="isAvailable" id="isAvailableTop" class="w-4 h-4">
          <label for="isAvailableTop" class="text-sm font-medium">Còn hàng</label>
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-3">
        <button type="button" (click)="onCancel()" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-100 transition">Hủy</button>
        <button type="submit" [disabled]="submitting" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition disabled:bg-blue-400">
          {{ submitting ? 'Đang lưu...' : 'Lưu' }}
        </button>
      </div>
    </form>
  </div>
</div>
