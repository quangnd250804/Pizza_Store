<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 via-white to-amber-50 py-12 px-4">
  <div class="max-w-md w-full">

    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="bg-gradient-to-r from-orange-500 to-red-500 px-8 py-10 text-center relative">
        <div class="flex justify-center -mt-4 mb-4">
          <span class="text-7xl drop-shadow-xl">🍕</span>
        </div>
        <h2 class="text-4xl font-bold text-white tracking-tight">PIZZA STORE</h2>
        <p class="text-orange-100 mt-2 text-lg">Đăng nhập để đặt pizza ngon</p>
      </div>

      <div class="p-8">

        <!-- Error Message -->
        <div *ngIf="errorMessage"
          class="bg-red-50 border border-red-300 text-red-700 px-5 py-4 rounded-2xl mb-6 flex items-start gap-3">
          <span class="text-red-500 text-xl mt-0.5">⚠️</span>
          <p class="text-sm font-medium">{{ errorMessage }}</p>
        </div>

        <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <div class="space-y-5">

            <!-- Username -->
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Tên đăng nhập</label>
              <input type="text" formControlName="username"
                class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all text-gray-900 placeholder-gray-400"
                [ngClass]="{'!border-red-500 focus:!ring-red-200': loginForm.get('username')?.touched && loginForm.get('username')?.invalid}"
                placeholder="Nhập tên đăng nhập...">
              <p *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')"
                class="mt-2 text-xs text-red-500 flex items-center gap-1">
                <span>●</span> Tên đăng nhập không được để trống.
              </p>
            </div>

            <!-- Password -->
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Mật khẩu</label>
              <input type="password" formControlName="password"
                class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all text-gray-900 placeholder-gray-400"
                [ngClass]="{'!border-red-500 focus:!ring-red-200': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
                placeholder="••••••••">
              <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')"
                class="mt-2 text-xs text-red-500 flex items-center gap-1">
                <span>●</span> Mật khẩu không được để trống.
              </p>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" [disabled]="isLoading"
            class="w-full py-4 px-6 bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white font-bold text-base rounded-2xl transition-all duration-200 shadow-lg shadow-orange-500/40 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-3">

            <span *ngIf="isLoading"
              class="animate-spin w-5 h-5 border-2 border-white border-t-transparent rounded-full"></span>

            <span>{{ isLoading ? 'Đang xác thực...' : 'ĐĂNG NHẬP' }}</span>
          </button>

          <!-- Register Link -->
          <div class="text-center pt-4">
            <span class="text-gray-600">Bạn chưa có tài khoản?</span>
            <a routerLink="/register"
              class="ml-2 font-semibold text-orange-600 hover:text-orange-700 transition-colors">
              Đăng ký ngay
            </a>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="bg-gray-50 border-t px-8 py-5 text-center text-xs text-gray-500">
        © Pizza Store - Pizza nóng hổi • Giao nhanh tận nơi
      </div>
    </div>
  </div>
</div>
